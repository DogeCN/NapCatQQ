name: Release Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v4.10.7)'
        required: true
        type: string

permissions: write-all

env:
  RELEASE_NAME: "NapCat"

jobs:
  build:
    name: Build NapCat (Full Build)
    runs-on: ubuntu-latest
    steps:
      - name: Clone Main Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false
      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
      - name: Build NapCat (Full Build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm i
          pnpm --filter napcat-webui-frontend run build || exit 1
          pnpm run build:framework
          pnpm run build:shell
          pnpm --filter napcat-plugin-builtin run build || exit 1
          mv packages/napcat-framework/dist framework-dist
          mv packages/napcat-shell/dist shell-dist
          cd framework-dist
          npm install --omit=dev
          rm -f ./package-lock.json
          cd ../shell-dist
          npm install --omit=dev
          rm -f ./package-lock.json
      - name: Upload Artifact (Framework)
        uses: actions/upload-artifact@v6
        with:
          name: NapCat.Framework
          path: framework-dist
      - name: Upload Artifact (Shell)
        uses: actions/upload-artifact@v6
        with:
          name: NapCat.Shell
          path: shell-dist

  release-napcat:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts

      - name: Zip Artifacts
        run: |
            cd artifacts
            [ -d NapCat.Framework ] && (cd NapCat.Framework && zip -qr ../../NapCat.Framework.zip .)
            [ -d NapCat.Shell ] && (cd NapCat.Shell && zip -qr ../../NapCat.Shell.zip .)
            cd ..

      - name: Generate release note
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          CURRENT_TAG="${{ inputs.version }}"
          CURRENT_TAG_NORMALIZED="${CURRENT_TAG#v}"

          TAGS_JSON=$(curl -s "https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/tags?per_page=100")

          # Build array with "normalized_version<TAB>original_tag" for proper deduplication and sorting
          NORMALIZED_MAP=$(echo "$TAGS_JSON" | jq -r '.[].name' | while read -r t; do
            tn="${t#v}"
            printf '%s\t%s\n' "$tn" "$t"
          done)

          # Sort by normalized version, deduplicate (keep first occurrence per normalized version)
          UNIQUE_TAGS=$(echo "$NORMALIZED_MAP" | sort -t$'\t' -k1,1 -V | awk -F'\t' '!seen[$1]++')

          # Extract sorted original tags
          TAGS=( $(echo "$UNIQUE_TAGS" | cut -f2) )
          echo "Sorted unique tags (normalized):"
          printf '  %s\n' "${TAGS[@]}"

          # Find current tag index (try exact match first, then normalized match)
          CURRENT_INDEX=-1
          for i in "${!TAGS[@]}"; do
            t="${TAGS[$i]}"
            tn="${t#v}"
            if [ "$t" = "$CURRENT_TAG" ] || [ "$tn" = "$CURRENT_TAG_NORMALIZED" ]; then
              CURRENT_INDEX=$i
              # Ensure we use the exact tag that was pushed for checkout consistency
              if [ "$t" != "$CURRENT_TAG" ] && [ "$tn" = "$CURRENT_TAG_NORMALIZED" ]; then
                echo "Note: Found matching tag '$t' for current '$CURRENT_TAG' (same normalized version)"
              fi
              break
            fi
          done

          PREV_TAG=""
          if [ "$CURRENT_INDEX" -ge 0 ] && [ "$CURRENT_INDEX" -gt 0 ]; then
            PREV_TAG="${TAGS[$((CURRENT_INDEX-1))]}"
          fi

          if [ -z "$PREV_TAG" ]; then
            echo "Could not find previous tag for $CURRENT_TAG, using first commit"
            PREV_TAG=$(git rev-list --max-parents=0 HEAD | head -1)
          else
            echo "Previous tag: $PREV_TAG"
          fi

          echo "Current tag: $CURRENT_TAG"
          COMMITS=$(git log --pretty=format:'- %s (%h)' "$PREV_TAG".."$CURRENT_TAG" 2>/dev/null || git log --pretty=format:'- %s (%h)' -20)
          echo "$COMMITS" > commits.txt

          sed "s/{VERSION}/$CURRENT_TAG/g; s/{PREV_VERSION}/$PREV_TAG/g; s|{REPO}|${GITHUB_REPOSITORY}|g" .github/prompt/default.md > CHANGELOG.md
          echo "=== generated release note ==="
          cat CHANGELOG.md

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: NapCat ${{ inputs.version }}
          body_path: CHANGELOG.md
          files: |
            NapCat.Framework.zip
            NapCat.Shell.zip
          draft: false