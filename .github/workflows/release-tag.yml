name: Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v4.10.7). Leave empty to use the latest pushed tag.'
        required: false
        type: string
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions: write-all

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.check.outputs.valid }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate semantic version
        id: check
        run: |
          # 优先使用手动输入的版本号，否则从 GITHUB_REF 提取 tag
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
            echo "Using manually provided version: $TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Extracted from GITHUB_REF: $TAG"
          fi

          SEMVER_REGEX="^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?$"

          if [[ "$TAG" =~ $SEMVER_REGEX ]]; then
            echo "Valid semantic version: $TAG"
            echo "Note: Using the exact tag name as passed for checkout."
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "version=$TAG" >> $GITHUB_OUTPUT
          else
            echo "Invalid version format: $TAG"
            echo "Expected format: vX.Y.Z, X.Y.Z, vX.Y.Z-prerelease, or X.Y.Z-prerelease"
            echo "Examples: v1.0.0, 4.18.13, v1.2.3-beta, 2.0.0-rc.1"
            echo ""
            echo "Hint: If you are triggering this workflow manually, please provide the 'version' input."
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  trigger-release:
    needs: [validate-version]
    if: needs.validate-version.outputs.valid == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger release-publish workflow
        env:
          GH_TOKEN: ${{ secrets.NAPCAT_BUILD }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Triggering release-publish workflow with version=${VERSION}"

          if [ -z "$GH_TOKEN" ]; then
            echo "Error: NAPCAT_BUILD secret is not set or empty!"
            echo "Please add NAPCAT_BUILD secret in repository Settings > Secrets and variables > Actions"
            echo "The token requires 'repo' and 'workflow' scopes."
            exit 1
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/release-publish.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"${VERSION}\"}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          if [ -n "$BODY" ]; then
            echo "Response: $BODY"
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Successfully triggered release-publish workflow for ${VERSION}"
          else
            echo "Error: Failed to trigger release-publish workflow (HTTP ${HTTP_CODE})"
            case "$HTTP_CODE" in
              401|403)
                echo "Check that NAPCAT_BUILD token has 'workflow' permission and is not expired."
                ;;
              404)
                echo "Check that release-publish.yml workflow exists and repository name is correct."
                ;;
              422)
                echo "Validation error: check inputs.version format."
                ;;
            esac
            exit 1
          fi